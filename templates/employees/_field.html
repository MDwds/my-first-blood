<div class="form-field {% if field.errors %}form-field-error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required %}<span class="required-mark">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-error">{{ field.errors }}</div>{% endif %}
</div>
